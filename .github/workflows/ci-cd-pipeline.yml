name: 🚀 Meekong API CI/CD

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

env:
    NODE_VERSION: "22"
    AWS_REGION: "ap-southeast-1"
    ECR_REPOSITORY: "meekong-api"

permissions:
    id-token: write
    contents: read

jobs:
    quality-gate:
        name: 🔍 Quality Gate
        runs-on: ubuntu-latest

        steps:
            - name: 📥 Checkout
              uses: actions/checkout@v4

            - name: 🚀 Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            - name: 📦 Install Dependencies
              run: |
                  npm ci --no-audit --prefer-offline
                  npx prisma generate

            - name: 🔍 Lint Code
              run: npm run lint

            - name: 🔧 Type Check
              run: npx tsc --noEmit

            - name: 🏗️ Build
              run: npm run build

            - name: 🛡️ Security Audit
              run: npm audit --audit-level=high
              continue-on-error: true

