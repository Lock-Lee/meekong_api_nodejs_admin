  /api/v2/items:
    post:
      summary: Create item (V2 - JSON only, no media)
      tags:
        - Items V2
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - brandId
                - categoryId
                - nameTh
                - nameEn
                - descriptionTh
                - descriptionEn
                - itemType
                - sellType
                - itemVariants
              properties:
                code:
                  type: string
                  description: Unique item code
                brandId:
                  type: string
                  format: uuid
                categoryId:
                  type: string
                  format: uuid
                nameTh:
                  type: string
                nameEn:
                  type: string
                descriptionTh:
                  type: string
                descriptionEn:
                  type: string
                itemType:
                  type: string
                  enum:
                    - NEW
                    - USED
                sellType:
                  type: string
                  enum:
                    - NORMAL
                    - AUCTION
                    - SATISFY
                    - RFQ
                shippingDuration:
                  type: integer
                  minimum: 1
                  maximum: 30
                  description: Shipping duration in days (1-30)
                tags:
                  type: array
                  maxItems: 3
                  items:
                    type: string
                  description: Product tags (max 3)
                itemVariants:
                  type: array
                  items:
                    type: object
                    required:
                      - variantName
                      - price
                    properties:
                      variantName:
                        type: string
                      price:
                        type: number
                      stockQuantity:
                        type: number
                        default: 0
                      sku:
                        type: string
                        description: SKU code (auto-generated if not provided)
                      color:
                        type: string
                        description: Color or pattern
                      conditionDescription:
                        type: string
                        enum:
                          - NEW_GOOD
                          - USED_GOOD
                          - USED_FAIR
                          - USED_BAD
                          - DAMAGED
                        description: Product condition
                      defectNotes:
                        type: string
                        description: Notes about defects or imperfections
                      includedItems:
                        type: string
                        description: Included accessories (e.g., "charger, box")
                      weight:
                        type: integer
                        description: Weight in grams
                        example: 500
                      dimensionWidth:
                        type: integer
                        description: Width in centimeters
                        example: 20
                      dimensionHigh:
                        type: integer
                        description: Height in centimeters
                        example: 30
                      dimensionLong:
                        type: integer
                        description: Length in centimeters
                        example: 40
                      sizes:
                        type: array
                        items:
                          type: object
                          properties:
                            sizeUnitId:
                              type: string
                              format: uuid
                            value:
                              type: string
                            sortOrder:
                              type: integer
      responses:
        '201':
          description: Item created successfully
        '400':
          description: Invalid request data
        '401':
          description: Authentication required
