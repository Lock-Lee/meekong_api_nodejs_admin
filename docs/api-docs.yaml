        - bearerAuth: []
      parameters:
        - in: path
          name: conversationId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - senderId
                - senderType
              properties:
                message:
                  type: string
                  description: The message content (required if no attachments)
                messageType:
                  type: string
                  enum:
                    - TEXT
                    - IMAGE
                    - PRODUCT
                    - ORDER
                    - REPLY
                  description: >-
                    Type of message (for IMAGE type, use attachments field for
                    image data)
                  default: TEXT
                attachments:
                  type: string
                  description: >-
                    JSON string containing attachment data (image URLs for IMAGE
                    type)
                senderId:
                  type: string
                  description: ID of the message sender (required)
                senderType:
                  type: string
                  enum:
                    - USER
                    - SHOP
                    - ADMIN
                  description: Type of the sender (required)
                replyToId:
                  type: string
                  description: ID of the message being replied to (optional)
              example:
                message: Hello, how are you?
                messageType: TEXT
                senderId: user-uuid-123
                senderType: USER
      responses:
        '200':
          description: Message sent successfully
        '401':
          description: Unauthorized
