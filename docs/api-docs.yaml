openapi: 3.0.0
info:
  title: Meekong API
  version: 1.0.0
  description: API documentation for the Meekong project
servers:
  - url: http://localhost:3000
    description: Development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateBuyerAddress:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        label:
          type: string
        fullName:
          type: string
        phone:
          type: string
        address:
          type: string
        subDistrict:
          type: string
        district:
          type: string
        province:
          type: string
        postalCode:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        country:
          type: string
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BuyerAddress:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        label:
          type: string
        fullName:
          type: string
        phone:
          type: string
        address:
          type: string
        subDistrict:
          type: string
        district:
          type: string
        province:
          type: string
        postalCode:
          type: string
        country:
          type: string
        isDefault:
          type: boolean
        latitude:
          type: number
        longitude:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
security:
  - bearerAuth: []
paths:
  /api/auction/:
    get:
      tags:
        - Auction
      summary: Get all auctions
      responses:
        '200':
          description: Successful operation
    post:
      tags:
        - Auction
      summary: Create a new auction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
                itemId:
                  type: string
      responses:
        '201':
          description: Auction created successfully
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
  /api/auction/{id}:
    get:
      tags:
        - Auction
      summary: Get auction by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Auction ID
      responses:
        '200':
          description: Successful operation
        '404':
          description: Auction not found
  /api/auctionParticipant/join:
    post:
      tags:
        - Auction Participant
      summary: Join an auction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                auctionId:
                  type: string
      responses:
        '201':
          description: Successfully joined auction
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
  /api/auctionParticipant/{auctionId}:
    get:
      tags:
        - Auction Participant
      summary: Get participants by auction ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: auctionId
          required: true
          schema:
            type: string
          description: Auction ID
      responses:
        '200':
          description: Successful operation
        '401':
          description: Unauthorized
        '404':
          description: Auction not found
  /api/auctionParticipant/{id}/status:
    patch:
      tags:
        - Auction Participant
      summary: Update participant status
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Participant ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - pending
                    - approved
                    - rejected
      responses:
        '200':
          description: Status updated successfully
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '404':
          description: Participant not found
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successful login
        '401':
          description: Invalid credentials
  /api/auth/login-by-phone:
    post:
      tags:
        - Auth
      summary: User login by phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: Phone number
                pin:
                  type: string
                  description: 6-digit PIN
                token:
                  type: string
                  description: Authentication token
                firebaseToken:
                  type: string
                  description: Firebase token (optional)
                deviceInfo:
                  type: object
                  description: Device information (optional)
                  properties:
                    id:
                      type: string
                      description: Device ID
                    name:
                      type: string
                      description: Device name
                    type:
                      type: string
                      description: Device type
      responses:
        '200':
          description: Successful login
        '401':
          description: Invalid credentials
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: User registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                name:
                  type: string
      responses:
        '201':
          description: User created successfully
        '400':
          description: Invalid input
  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: User logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful logout
        '401':
          description: Unauthorized
  /api/auth/refresh-token:
    post:
      tags:
        - Auth
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token refreshed successfully
        '401':
          description: Invalid refresh token
  /api/auth/google:
    post:
      tags:
        - Auth
      summary: Login with Google
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accessToken:
                  type: string
                firebaseToken:
                  type: string
                deviceInfo:
                  type: object
      responses:
        '200':
          description: Successful login
  /api/auth/facebook:
    post:
      tags:
        - Auth
      summary: Login with Facebook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accessToken:
                  type: string
                firebaseToken:
                  type: string
                deviceInfo:
                  type: object
      responses:
        '200':
          description: Successful login
  /api/auth/line:
    post:
      tags:
        - Auth
      summary: Login with LINE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accessToken:
                  type: string
                firebaseToken:
                  type: string
                deviceInfo:
                  type: object
      responses:
        '200':
          description: Successful login
  /api/auth/forget:
    post:
      tags:
        - Auth
      summary: Forgot password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
      responses:
        '200':
          description: Password reset email sent
  /api/auth/reset-password:
    post:
      tags:
        - Auth
      summary: Reset password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                confirmPassword:
                  type: string
      responses:
        '200':
          description: Password reset successfully
  /api/bid/getAll:
    get:
      tags:
        - Bid
      summary: Get all bids
      responses:
        '200':
          description: Successful operation
  /api/bid/create:
    post:
      tags:
        - Bid
      summary: Create a new bid
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                auctionId:
                  type: string
      responses:
        '201':
          description: Bid created successfully
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
  /api/bid/getById/{id}:
    get:
      tags:
        - Bid
      summary: Get bid by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Bid ID
      responses:
        '200':
          description: Successful operation
        '404':
          description: Bid not found
  /api/bid/cancel/{id}:
    delete:
      tags:
        - Bid
      summary: Cancel a bid
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Bid ID
      responses:
        '200':
          description: Bid canceled successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Not authorized to cancel this bid
        '404':
          description: Bid not found
  /api/brand:
    get:
      tags:
        - Brand
      summary: Get all brands
      responses:
        '200':
          description: Successful operation
    post:
      tags:
        - Brand
      summary: Create a new brand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Brand created successfully
        '400':
          description: Invalid input
  /api/buyer-address/getAddress:
    get:
      tags:
        - Buyer Address
      summary: Get all addresses for the current user
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: searchText
          schema:
            type: string
          required: true
          description: Search text for addresses
        - in: query
          name: page
          schema:
            type: integer
          required: false
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
          required: false
          description: Number of items per page
      responses:
        '200':
          description: List of addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    zipcode:
                      type: string
                    subdistrict:
                      type: string
                    district:
                      type: string
                    province:
                      type: string
        '401':
          description: Unauthorized
  /api/buyer-address/:
    post:
      tags:
        - Buyer Address
      summary: Create a new buyer address
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBuyerAddress'
      parameters:
        - in: query
          name: userId
          schema:
            type: string
          required: true
          description: ID of the user to get addresses for
      responses:
        '201':
          description: Address created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerAddress'
        '400':
          description: Invalid input data
        '401':
          description: Unauthorized
    get:
      tags:
        - Buyer Address
      summary: Get all addresses for the current user
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: userId
          schema:
            type: string
          required: true
          description: ID of the user to get addresses for
      responses:
        '200':
          description: List of addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BuyerAddress'
        '401':
          description: Unauthorized
  /api/buyer-address/{id}:
    get:
      tags:
        - Buyer Address
      summary: Get address by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Address ID
      responses:
        '200':
          description: Address details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerAddress'
        '401':
          description: Unauthorized
        '404':
          description: Address not found
    put:
      tags:
        - Buyer Address
      summary: Replace an existing address
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Address ID to replace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuyerAddress'
      responses:
        '200':
          description: Address replaced successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerAddress'
        '400':
          description: Invalid input data
        '401':
          description: Unauthorized
        '404':
          description: Address not found
    delete:
      tags:
        - Buyer Address
      summary: Delete an address
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Address ID to delete
      responses:
        '200':
          description: Address deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Address not found
  /api/buyer-checkout/:
    post:
      tags:
        - Buyer Checkout
      summary: Checkout and create order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                buyerId:
                  type: string
                  description: ID of the buyer
                shopId:
                  type: string
                  description: ID of the shop
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      productId:
                        type: string
                        description: ID of the product
                      quantity:
                        type: integer
                        description: Quantity of the product
                addressId:
                  type: string
                  description: ID of the address
                paymentMethod:
                  type: string
                  description: Payment method (e.g., 'CREDIT_CARD', 'PROMPTPAY')
                totalAmount:
                  type: number
                  description: Total amount for the order
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResult'
        '400':
          description: Invalid input data
        '401':
          description: Unauthorized
  /api/buyer-checkout/{orderId}/paid:
    patch:
      tags:
        - Buyer Checkout
      summary: Update order status to PAID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
          description: ID of the order to update
      responses:
        '200':
          description: Order status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId:
                    type: string
                    description: ID of the updated order
                  status:
                    type: string
                    description: New status of the order
                  updatedAt:
                    type: string
                    format: date-time
                    description: Timestamp of the update
        '400':
          description: Invalid order ID
        '401':
          description: Unauthorized
        '404':
          description: Order not found
  /api/buyer-favorite/:
    post:
      tags:
        - Buyer Favorite
      summary: Add a new favorite item
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: ID of the user
                itemId:
                  type: string
                  description: ID of the item to be added as favorite
                variantId:
                  type: string
                  description: (Optional) ID of the item variant
              required:
                - userId
                - itemId
      parameters:
        - in: query
          name: requestId
          schema:
            type: string
          required: true
          description: Request ID for tracking
      responses:
        '201':
          description: Favorite added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerFavorite'
        '400':
          description: Invalid input data
        '401':
          description: Unauthorized
    get:
      tags:
        - Buyer Favorite
      summary: Get all favorites for the current user
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: requestId
          schema:
            type: string
          required: true
          description: Request ID for tracking
      responses:
        '200':
          description: List of favorites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BuyerFavorite'
        '401':
          description: Unauthorized
  /api/buyer-favorite/{id}:
    delete:
      tags:
        - Buyer Favorite
      summary: Remove a favorite
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Favorite ID to remove
        - in: query
          name: requestId
          schema:
            type: string
          required: true
          description: Request ID for tracking
      responses:
        '200':
          description: Favorite removed successfully
        '401':
          description: Unauthorized
        '404':
          description: Favorite not found
  /api/buyer-order:
    get:
      tags:
        - Buyer Order
      summary: Get all buyer orders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful operation
  /api/buyer-order/{status}:
    get:
      tags:
        - Buyer Order
      summary: Get buyer orders by status
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: status
          required: true
          schema:
            type: string
            enum:
              - PENDING
              - PAID
              - SHIPPED
              - COMPLETED
              - CANCELLED
              - DISPUTED
      responses:
        '200':
          description: Successful operation
  /api/buyer-payment/source:
    post:
      tags:
        - Buyer Payment
      summary: Create a new payment source
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: The type of the source
                  enum:
                    - promptpay
                    - mobile_banking_scb
                    - mobile_banking_bbl
                    - mobile_banking_kbank
                    - mobile_banking_bay
                    - truemoney
                    - alipay
                  example: promptpay
                amount:
                  type: number
                  description: The amount for the source (in satang)
                  example: 12000
                currency:
                  type: string
                  description: The currency for the source
                  example: THB
                email:
                  type: string
                  description: The email associated with the source
                  example: test@example.com
              required:
                - type
                - amount
                - currency
                - email
              example:
                type: promptpay
                amount: 12000
                currency: THB
                email: test@example.com
      responses:
        '201':
          description: Source created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Source created successfully.
                  data:
                    type: object
                    properties:
                      object:
                        type: string
                        example: source
                      id:
                        type: string
                        example: src_test_658vf9l3f9f2kiur4hp
                      type:
                        type: string
                        example: promptpay
                      amount:
                        type: number
                        example: 12000
                      currency:
                        type: string
                        example: THB
                      flow:
                        type: string
                        example: offline
        '400':
          description: Invalid input data
        '401':
          description: Unauthorized
  /api/buyer-payment/create:
    post:
      tags:
        - Buyer Payment
      summary: Add a new payment item (Create customer and card)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: The ID of the user
                  example: 0198a3eb-57cb-70f9-ab24-b921c25cb590
                email:
                  type: string
                  description: User email for Omise customer
                  example: test@example.com
                card:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Name on the card
                      example: Satid Seenun
                    number:
                      type: string
                      description: Card number (use 4242424242424242 for test)
                      example: '4242424242424242'
                    expiration_month:
                      type: integer
                      description: Expiration month of the card
                      example: 7
                    expiration_year:
                      type: integer
                      description: Expiration year of the card
                      example: 29
                    security_code:
                      type: string
                      description: Security code of the card
                      example: '111'
                    city:
                      type: string
                      description: City associated with the card
                      example: Bangkok
                    postal_code:
                      type: string
                      description: Postal code associated with the card
                      example: '11240'
                  required:
                    - name
                    - number
                    - expiration_month
                    - expiration_year
                    - security_code
              required:
                - userId
                - email
                - card
              example:
                userId: 0198a3eb-57cb-70f9-ab24-b921c25cb590
                email: test@example.com
                card:
                  name: Satid Seenun
                  number: '4242424242424242'
                  expiration_month: 7
                  expiration_year: 29
                  security_code: '111'
                  city: Bangkok
                  postal_code: '11240'
      responses:
        '201':
          description: Payment added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Buyer payment created successfully.
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: cust_test_658v3isewk0unmjl1jk
                      userId:
                        type: string
                        example: 0198a3eb-57cb-70f9-ab24-b921c25cb590
                      email:
                        type: string
                        example: test@example.com
        '400':
          description: Invalid input data
        '401':
          description: Unauthorized
  /api/buyer-payment/charges:
    post:
      tags:
        - Buyer Payment
      summary: Create a new charge for card payment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: The ID of the user
                  example: 0198a3eb-57cb-70f9-ab24-b921c25cb590
                amount:
                  type: number
                  description: The amount to be charged (in satang)
                  example: 10000
                currency:
                  type: string
                  description: The currency of the charge
                  example: THB
                customer:
                  type: string
                  description: The customer ID from Omise
                  example: cust_test_656ttmrsodhc4tpz9bl
                returnUri:
                  type: string
                  description: The return URI after the charge
                  example: https://example.com/return
                description:
                  type: string
                  description: A description for the charge
                  example: Test charge payment
              required:
                - userId
                - amount
                - currency
                - customer
                - returnUri
                - description
              example:
                userId: 0198a3eb-57cb-70f9-ab24-b921c25cb590
                amount: 10000
                currency: THB
                customer: cust_test_656ttmrsodhc4tpz9bl
                returnUri: https://example.com/return
                description: Test charge payment
      responses:
        '201':
          description: Charge created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  message:
                    type: string
